defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

loss:
  reg: sigreg          # sigreg (LeWM) | epi (EpiWM); for epi also set model=epi
  epi:
    weight: 0.03       # lambda_e: loss = pred - weight * S / S0
    width: 192         # reservoir width = embed_dim, so the log-det can reward every embedding direction
    reservoir_seed: 4000
    target: frame      # what the ridge readout predicts from what:
                       #   frame        random CNN features of x_t       -> z_t          (EpiWM)
                       #   next         random CNN features of x_{t+1}   -> z_t
                       #   latent       random MLP features of (z_t,a_t) -> z_{t+1}      (latent dynamics)
                       #   latent_delta random MLP features of (z_t,a_t) -> z_{t+1}-z_t
    detach_inputs: false   # latent targets only: true = no gradient through the (z_t, a_t) features
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
